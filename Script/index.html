<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Scripts de Atendimento</title>
  <!-- JS externo -->
  <script src="js/script.js"></script>
  <!-- Fonte -->
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@600;800&display=swap" rel="stylesheet"/>

  <!-- CSS externo -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <div class="logo-mark">💬</div>
  <div>
    <h1 class="">Scripts de <span>Atendimento</span></h1>
    <div class="subtitle">Clique em copiar para usar no chat</div>
  </div>
</header>
    <Button class="transfer-btn" onclick="irParaTransferencia()">Transferencia</Button>
    

<!-- Abertura -->
<div class="divider">— Abertura</div>
<br>
<div class="grid">

  <div class="card" data-category="abertura-manha">
    <span class="tag-aberturassa-abertura">Abertura</span>

    <!-- Bom dia -->
    <div class="card-body">
      <div class="script-label">Manhã</div>
      <div class="script-text">
        Saudações (Manha)
      </div>
    </div>

    <button class="copy-btn" onclick="copyScript(this)">
      Copiar
    </button>
  </div>
  <!-- Bom dia -->

  <!-- Boa tarde -->

    <div class="card" data-category="abertura-tarde">
    <span class="tag-aberturassa-abertura">Abertura</span>

    <div class="card-body">
      <div class="script-label">Tarde</div>
      <div class="script-text">
        Saudações (Tarde)
      </div>
    </div>

    <button class="copy-btn" onclick="copyScript(this)">
      Copiar
    </button>
  </div>
  <!-- Boa tarde -->

</div>

<br>
<br>


<!-- Técnico -->
<div class="divider">— Técnico</div>
<br>
<div class="grid">

    <!-- Manutenção -->
    <div class="card" data-category="tecnico-manutencao">
    <span class="tag-aberturassa-tec">Técnico</span>

    <div class="card-body">
      <div class="script-label">Manutenção</div>
      <div class="script-text">
        Pedir AnyDesk para ajuste
      </div>
    </div>

    <button class="copy-btn" onclick="copyScript(this)">
      Copiar
    </button>
  </div>
  <!-- Manutenção -->

  <!-- Instalação -->
   <div class="card" data-category="tecnico-instalacao">
    <span class="tag-aberturassa-tec">Técnico</span>

    <div class="card-body">
      <div class="script-label">Instalação</div>
      <div class="script-text">
        Pedir AnyDesk para instalação
      </div>
    </div>

    <button class="copy-btn" onclick="copyScript(this)">
      Copiar
    </button>
  </div>
  <!-- Instalação -->

</div>

<br>
<br>

<!-- Finalizção -->
<div class="divider">— Finalizção</div>
<br>
<div class="grid">

  <!-- Finalização -->
  <div class="card" data-category="finalizacao">
    <span class="tag-aberturassa-tchau">Tchau</span>

    <div class="card-body">
      <div class="script-label">Finalizção</div>
      <div class="script-text">
        Encerramento
      </div>
    </div>

    <button class="copy-btn" onclick="copyScript(this)">
      Copiar
    </button>
  </div>
  <!-- Finalização -->

</div>

<div class="toast" id="toast"></div>



</body>
</html>
